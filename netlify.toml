# Same-origin proxy for PostHog (the headTags script in docusaurus.config.mjs),
# also used by t1protocol.com, which Firebase Hosting cannot proxy itself.
[[redirects]]
from = "/relay/static/*"
to = "https://us-assets.i.posthog.com/static/:splat"
status = 200
force = true

[[redirects]]
from = "/relay/*"
to = "https://us.i.posthog.com/:splat"
status = 200
force = true

[[redirects]]
from = "/concepts/*"
to = "/intro/:splat"
status = 301

[[redirects]]
from = "/tee-litepaper.pdf"
to = "/intro/resources/"
status = 301
force = true

[[redirects]]
from = "/t1-litepaper.pdf"
to = "/intro/resources/"
status = 301
force = true
